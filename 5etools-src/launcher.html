<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge D VTT Game Launcher</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0c0e14;
            --card-bg: rgba(22, 26, 36, 0.85);
            --border-gold: rgba(223, 160, 30, 0.35);
            --accent-gold: #dfa01e;
            --accent-gold-hover: #f5b72b;
            --text-light: #e0e6ed;
            --text-muted: #8a99ad;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 20%, rgba(223, 160, 30, 0.08) 0%, transparent 60%);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .portal-container {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(223, 160, 30, 0.1);
            backdrop-filter: blur(10px);
        }

        .portal-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .launcher-logo-img {
            max-height: 100px;
            width: auto;
            display: block;
            margin: 0 auto 16px auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .portal-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.15;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(223, 160, 30, 0.2);
        }

        .portal-title .title-gold {
            color: var(--accent-gold);
            display: block;
        }

        .portal-title .title-vtt {
            color: var(--text-light);
            display: block;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .portal-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            background: rgba(10, 12, 18, 0.7);
        }

        .input-group-custom input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 14px 18px;
            font-size: 1.05rem;
            outline: none;
        }

        .input-group-custom input::placeholder {
            color: #556275;
        }

        .input-group-addon {
            padding: 14px 16px;
            background: rgba(223, 160, 30, 0.12);
            color: var(--accent-gold);
            font-size: 0.95rem;
            font-weight: 600;
            border-left: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
        }

        .btn-launch {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dfa01e 0%, #b87c12 100%);
            border: none;
            border-radius: 8px;
            color: #0c0e14;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(223, 160, 30, 0.3);
        }

        .btn-launch:hover {
            background: linear-gradient(135deg, #f5b72b 0%, #d4931a 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(223, 160, 30, 0.45);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        .campaign-list {
            display: grid;
            gap: 12px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .campaign-card {
            background: rgba(12, 14, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .campaign-card:hover {
            border-color: var(--accent-gold);
            background: rgba(223, 160, 30, 0.08);
            color: #ffffff;
            transform: translateX(4px);
        }

        .campaign-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .campaign-sub {
            font-size: 0.8rem;
            color: var(--accent-gold);
            background: rgba(223, 160, 30, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(223, 160, 30, 0.25);
        }

        .error-msg {
            color: #ff5252;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="portal-header">
        <img src="img/logo.png" alt="Forge D VTT Logo" class="launcher-logo-img">
        <h1 class="portal-title">
            <span class="title-gold">Forge D</span>
            <span class="title-vtt">VTT</span>
        </h1>
        <p class="portal-subtitle">Online Virtual Tabletop Game Launcher</p>
    </div>

    <form id="launch-form">
        <div class="form-group">
            <label class="form-label" for="subdomain-input">Enter Campaign Subdomain</label>
            <div class="input-group-custom">
                <input type="text" id="subdomain-input" placeholder="e.g. julz or cosmic" autocomplete="off" required>
                <div class="input-group-addon" id="domain-suffix">.forgedvtt.com</div>
            </div>
            <div class="error-msg" id="subdomain-error">Subdomain must be 2 to 32 alphanumeric characters.</div>
        </div>

        <button type="submit" class="btn-launch">ENTER CAMPAIGN GAME</button>
    </form>

    <div class="divider">
        <span>Active Campaigns</span>
    </div>

    <div class="campaign-list" id="campaigns-container">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">Loading campaigns...</div>
    </div>
</div>

<script>
    const form = document.getElementById('launch-form');
    const input = document.getElementById('subdomain-input');
    const suffix = document.getElementById('domain-suffix');
    const errorMsg = document.getElementById('subdomain-error');
    const campaignsContainer = document.getElementById('campaigns-container');

    const currentHost = window.location.hostname;
    const currentPort = window.location.port;

    // Detect if running locally (localhost / IP) or production domain
    const isLocalhost = currentHost === 'localhost' || currentHost === '127.0.0.1' || currentHost.startsWith('192.168.');
    if (isLocalhost) {
        suffix.textContent = `.${currentHost}${currentPort ? ':' + currentPort : ''}`;
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = input.value.trim().toLowerCase();
        const cleaned = raw.replace(/[^a-z0-9-]/g, '');

        if (!cleaned || cleaned.length < 2 || cleaned.length > 32) {
            errorMsg.style.display = 'block';
            return;
        }

        errorMsg.style.display = 'none';

        if (isLocalhost) {
            // Local dev testing URL format
            const portSuffix = currentPort ? `:${currentPort}` : '';
            window.location.href = `${window.location.protocol}//${cleaned}.${currentHost}${portSuffix}/vtt.html`;
        } else {
            // Cloudflare domain format
            const baseDomain = currentHost.split('.').slice(-2).join('.');
            window.location.href = `https://${cleaned}.${baseDomain}/vtt.html`;
        }
    });

    // Fetch campaign list from server
    fetch('/api/campaigns')
        .then(res => res.json())
        .then(campaigns => {
            campaignsContainer.innerHTML = '';
            if (!campaigns || campaigns.length === 0) {
                campaignsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">No active campaigns found. Enter a subdomain above to create one.</div>';
                return;
            }

            campaigns.forEach(c => {
                const card = document.createElement('a');
                card.className = 'campaign-card';
                card.href = isLocalhost 
                    ? `${window.location.protocol}//${c.id}.${currentHost}${currentPort ? ':' + currentPort : ''}/vtt.html`
                    : `https://${c.id}.forgedvtt.com/vtt.html`;

                card.innerHTML = `
                    <span class="campaign-name">⚔️ ${c.name}</span>
                    <span class="campaign-sub">${c.id}</span>
                `;
                campaignsContainer.appendChild(card);
            });
        })
        .catch(err => {
            console.error('Failed to load campaigns:', err);
            campaignsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Enter a subdomain above to launch your campaign.</div>';
        });
</script>

</body>
</html>
