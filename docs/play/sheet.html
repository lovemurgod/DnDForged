<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' wss: https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeD VTT - Sheet</title>
    <script src="js/bootstrap/vtt-preboot.js?v=mwzii5ci"></script>
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;800&family=Exo+2:wght@400;600;700;800&family=MedievalSharp&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Orbitron:wght@400;600;700;800&family=Outfit:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Rye&family=Syne:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=mwzii5ci">
    
    <!-- ForgeD VTT Custom Stylesheet -->
    <link rel="stylesheet" href="css/vtt.css?v=mwzii5ci">
    
    <!-- 3D WebGL Dice Engine Stylesheet -->
    <link rel="stylesheet" href="css/dice-3d.css?v=mwzii5ci">
    
    <!-- Socket.io & Static/P2P Shim (deferred) -->
    <script defer src="static-flag.js"></script>
    <script defer src="js/network/vtt-static-shim.js?v=mwzii5ci"></script>
    <script defer src="lib/peerjs.min.js?v=mwzii5ci"></script>
    <script defer src="js/network/vtt-p2p-host-engine.js?v=mwzii5ci"></script>
    <script defer src="js/network/vtt-p2p-adapter.js?v=mwzii5ci"></script>

    <!-- DOMPurify Standalone Sanitizer (XSS Protection) -->
    <script defer src="lib/purify.min.js?v=mwzii5ci"></script>

    <!-- Preload standalone sheet entrypoint -->
    <link rel="modulepreload" href="js/bootstrap/sheet-boot.js?v=mwzii5ci">

    <!-- ForgeDVTT Standalone Parsers & Utilities -->
    <script type="module" src="js/vtt-dice-parser.js?v=mwzii5ci"></script>
    <script type="module" src="js/vtt-entry-resolver.js?v=mwzii5ci"></script>
    <script type="module" src="js/vtt-assets.js?v=mwzii5ci"></script>
</head>
<body class="standalone-sheet-body">

    <!-- 3D Dice Roller Canvas Overlay -->
    <div id="dice-box-canvas-container"></div>

    <!-- Standalone Sheet Top Bar -->
    <header id="standalone-sheet-header" class="standalone-header glassmorphism">
        <div class="standalone-header-left">
            <img src="img/TextLogo.png" alt="ForgeD VTT" class="standalone-logo">
            <div class="standalone-title-wrap">
                <span class="standalone-campaign-badge" id="header-campaign-badge">Campaign: Default</span>
                <h1 class="standalone-sheet-title" id="header-sheet-title">Loading Sheet...</h1>
            </div>
        </div>
        <div class="standalone-header-right">
            <button id="btn-dock-sheet" class="btn btn-secondary btn-sm standalone-btn-dock" title="Dock into Tabletop (Close Tab)">
                <i class="fa-solid fa-arrow-down-left-and-arrow-up-right-to-center"></i>
                <span>Dock to VTT</span>
            </button>
        </div>
    </header>

    <!-- Main Sheet Mount Container -->
    <main id="standalone-sheet-container" class="standalone-container">
        
        <!-- Creature / NPC / Companion Sheet Mount -->
        <div id="creature-sheet-panel" class="standalone-panel vtt-hidden">
            <button id="creature-sheet-minimize-btn" class="cs-minimize-btn vtt-hidden" style="display:none;"></button>
            <div id="vtt-creature-sheet-panel" class="scroll-styled standalone-content">
                <div class="cs-placeholder">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading Creature Stat Block...</p>
                </div>
            </div>
        </div>

        <!-- Player Sheet Mount -->
        <div id="player-sheet-panel" class="standalone-panel vtt-hidden">
            <button id="player-sheet-minimize-btn" class="cs-minimize-btn vtt-hidden" style="display:none;"></button>
            <div id="player-sheet-content" class="scroll-styled standalone-content" style="display: flex; flex-direction: column; height: 100%;">
                <div class="cs-placeholder" id="player-sheet-placeholder">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading Character Sheet...</p>
                </div>
                <div id="player-sheet-active" class="vtt-hidden" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                    <!-- Player Sheet Header Control Bar (Roll Mode, Whisper, Settings) -->
                    <div id="ps-top-control-bar" class="ps-top-control-bar">
                        <div class="ps-segmented-capsule" role="group" aria-label="Sheet Roll Mode">
                            <button type="button" class="ps-roll-mode-btn" data-mode="adv" title="Advantage (rolls with advantage)"><i class="fa-solid fa-angles-up"></i> Adv</button>
                            <button type="button" class="ps-roll-mode-btn active" data-mode="normal" title="Normal (1d20)">Norm</button>
                            <button type="button" class="ps-roll-mode-btn" data-mode="dis" title="Disadvantage (rolls with disadvantage)"><i class="fa-solid fa-angles-down"></i> Dis</button>
                        </div>
                        <div class="ps-actions-group">
                            <button type="button" class="ps-whisper-btn" id="ps-btn-gm-whisper" title="Whisper rolls from this sheet to GM only"><i class="fa-solid fa-user-secret"></i> GM</button>
                            <button type="button" class="ps-settings-cog-btn" id="ps-btn-sheet-settings" title="Sheet Settings"><i class="fa-solid fa-gear"></i></button>
                        </div>
                    </div>
                    <!-- Inner Tabs Header -->
                    <div class="ps-tabs-header" style="display: flex; flex-shrink: 0; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--color-border-subtle);">
                        <button class="ps-tab-btn active" data-tab="ps-primary" style="flex:1; padding:10px 0; background:transparent; border:none; color:var(--color-text-primary); cursor:pointer; font-weight:600; border-bottom: 2px solid transparent;">Primary</button>
                        <button class="ps-tab-btn" data-tab="ps-equipment" style="flex:1; padding:10px 0; background:transparent; border:none; color:var(--color-text-secondary); cursor:pointer; font-weight:600; border-bottom: 2px solid transparent;">Equipment</button>
                        <button class="ps-tab-btn" data-tab="ps-spells" style="flex:1; padding:10px 0; background:transparent; border:none; color:var(--color-text-secondary); cursor:pointer; font-weight:600; border-bottom: 2px solid transparent;">Spells</button>
                        <button class="ps-tab-btn" data-tab="ps-info" style="flex:1; padding:10px 0; background:transparent; border:none; color:var(--color-text-secondary); cursor:pointer; font-weight:600; border-bottom: 2px solid transparent;">Abilities</button>
                    </div>
                    <!-- Inner Tabs Content Area -->
                    <div class="ps-tabs-body scroll-styled" style="flex: 1; position: relative; overflow-y: auto;">
                        <div id="ps-primary" class="ps-tab-content active" style="padding: 16px;"></div>
                        <div id="ps-equipment" class="ps-tab-content vtt-hidden" style="padding: 16px;"></div>
                        <div id="ps-spells" class="ps-tab-content vtt-hidden" style="padding: 16px;"></div>
                        <div id="ps-info" class="ps-tab-content vtt-hidden" style="padding: 16px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Standalone Bootstrap Script -->
    <script type="module" src="js/bootstrap/sheet-boot.js?v=mwzii5ci"></script>
</body>
</html>
